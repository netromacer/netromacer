<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="900" height="20" role="img" aria-label="divider">
<title>divider</title>
<defs>
<filter id="glow" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="0" y="9" width="900" height="2" fill="#ff3270" fill-opacity="0.35"/>
<g transform="translate(0,10)"><g>
<animateTransform attributeName="transform" type="skewX" values="0;0;24;-24;0;0" keyTimes="0;0.15;0.16;0.2;0.21;1" calcMode="discrete" dur="3s" repeatCount="indefinite"/>
<rect x="0" y="-1" width="900" height="2" fill="#ff3270"/></g></g>
<g transform="translate(0,10)"><g>
<animateTransform attributeName="transform" type="translate" values="0 0;-20 0;20 0;0 0;0 0" keyTimes="0;0.16;0.2;0.21;1" calcMode="discrete" dur="3s" repeatCount="indefinite"/>
<rect x="420" y="-4" width="60" height="1" fill="#00c3ff"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.16;0.2;0.21;1" calcMode="discrete" dur="3s" repeatCount="indefinite"/></rect></g></g>
</svg>
