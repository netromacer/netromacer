<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100" role="img" aria-label="end of transmission">
<title>end of transmission</title>
<defs>
<filter id="glow" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<polygon points="0,0 900,0 900,100 0,100" fill="#000807"/>
<polygon points="0,0 198,0 228,30 465,30 480,15 645,15 660,30 810,30 840,0 900,0 900,0 0,0" fill="#ff3270"/>
<text x="40" y="72" font-family="Consolas,'Courier New','Liberation Mono',monospace" font-size="22" font-weight="700" fill="#ff3270" textLength="330" lengthAdjust="spacingAndGlyphs">// END OF TRANSMISSION</text>
<rect x="380" y="56" width="14" height="5" fill="#ff3270"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.0s" repeatCount="indefinite"/></rect>
<text x="560" y="72" font-family="Consolas,'Courier New','Liberation Mono',monospace" font-size="14" fill="#89ddff" textLength="300" lengthAdjust="spacingAndGlyphs">hack ethically. hack legally. stay sharp.</text>
